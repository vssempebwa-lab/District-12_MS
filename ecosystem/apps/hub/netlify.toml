# Netlify site: District 12 Hub
# Site settings: Base directory = ecosystem, Package directory = apps/hub
[build]
command = "npm run check:deploy && npm run build:hub"
publish = "apps/hub/.next"

[build.environment]
NODE_VERSION = "20"
NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
package = "@netlify/plugin-nextjs"
