# Netlify site: Passito Marketing
# Site settings: Base directory = ecosystem, Package directory = apps/passito
[build]
command = "npm run check:deploy && npm run build:passito"
publish = "apps/passito/.next"

[build.environment]
NODE_VERSION = "20"
NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
package = "@netlify/plugin-nextjs"
