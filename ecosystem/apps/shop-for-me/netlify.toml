# Netlify site: Shop For Me
# Site settings: Base directory = ecosystem, Package directory = apps/shop-for-me
[build]
command = "npm run check:deploy && npm run build:shop-for-me"
publish = "apps/shop-for-me/.next"

[build.environment]
NODE_VERSION = "20"
NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
package = "@netlify/plugin-nextjs"
