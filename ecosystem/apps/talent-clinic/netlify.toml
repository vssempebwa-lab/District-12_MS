# Netlify site: Talent Clinic
# Site settings: Base directory = ecosystem, Package directory = apps/talent-clinic
[build]
command = "npm run check:deploy && npm run build:talent-clinic"
publish = "apps/mariz/.next"

[build.environment]
NODE_VERSION = "20"
NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
package = "@netlify/plugin-nextjs"
